name: CI
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          for i in $(seq 1 200); do echo "downloading package chunk $i ... ok"; done
          echo "Resolved 200 packages"

      - name: Run tests
        run: |
          echo "Running 3 tests..."
          echo "test_login PASSED"
          echo "test_signup PASSED"
          echo "ERROR: test_checkout FAILED"
          echo "AssertionError: expected total 42 but was 41"
          echo "  at com.example.CheckoutTest.totals(CheckoutTest.java:31)"
          echo "  at com.example.CheckoutTest.main(CheckoutTest.java:12)"
          exit 1
